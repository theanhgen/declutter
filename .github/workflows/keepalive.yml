# Keeps the reports database (Supabase free plan) from pausing: a paused project drops "send to developer" reports
# silently (it happened 2026-10-04..08). Supabase pauses after ~7 days without database requests; one read a day
# resets that. Secret DECLUTTER_REPORTS_KEY: the project's secret key (vault item declutter-reports-secret-key).
# GitHub disables schedules in a public repo after 60 days without commits; re-enable it in the Actions tab then.
name: keepalive
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: >
          curl -fsS --retry 3 -o /dev/null -w '%{http_code}\n'
          -H "apikey: $KEY"
          'https://wpsmgzihqgdmsrvzpcca.supabase.co/rest/v1/reports?select=id&limit=1'
        env:
          KEY: ${{ secrets.DECLUTTER_REPORTS_KEY }}
